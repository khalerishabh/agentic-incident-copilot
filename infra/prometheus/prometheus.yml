global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo
    # The demo apps already label their request metrics with `service`. honor_labels keeps
    # those, and the target labels below add `service` to process metrics (memory, CPU),
    # so every series can be selected by service.
    honor_labels: true
    static_configs:
      - targets: ["gateway:8000"]
        labels: { service: gateway }
      - targets: ["orders:8000"]
        labels: { service: orders }
      - targets: ["payments:8000"]
        labels: { service: payments }
      - targets: ["inventory:8000"]
        labels: { service: inventory }
