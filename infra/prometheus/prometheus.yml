global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fakeapp
    static_configs:
      - targets: ["gateway:8000", "orders:8000", "payments:8000", "inventory:8000"]
