name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COPILOT_TEST_POSTGRES_URL: postgresql://copilot:copilot@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" mypy types-PyYAML
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 30
    env:
      # No embedding model in CI, so runbooks use the keyword backend here.
      RUNBOOKS_BACKEND: keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test client
        run: pip install -e ".[dev]"
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: End-to-end tests
        env:
          E2E: "1"
        run: pytest -q tests/e2e
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=150
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
