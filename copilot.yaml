# Incident Copilot configuration. Secrets never go in this file:
# API keys, tokens and database URLs come from environment variables (see .env.example).
# Any value here can be overridden with COPILOT_<SECTION>__<KEY>, e.g. COPILOT_LLM__MODEL.

environment: dev

services:
  - name: gateway
    team: platform
  - name: orders
    team: commerce
  - name: payments
    team: payments
  - name: inventory
    team: commerce

llm:
  provider: anthropic
  model: claude-sonnet-4-5
  temperature: 0.0

mcp:
  logs_url: http://localhost:9101/mcp
  metrics_url: http://localhost:9102/mcp
  github_url: http://localhost:9103/mcp
  runbook_url: http://localhost:9104/mcp

budget:
  tokens_per_incident: 60000

guardrails:
  dry_run: true
  allowed_actions: [restart, scale, rollback, disable_flag]
  max_replicas: 5

integrations:
  logs:
    # loki for the demo stack and real installs; file reads ./data/logs for quick local runs.
    backend: loki
    service_label: service
    fields:
      timestamp: ts
      level: level
      message: msg
      request_id: request_id
    max_lines: 50
    max_scan_lines: 2000
    loki:
      url: http://localhost:3100
      line_format: json
      timeout_seconds: 10
      max_attempts: 3
      # tenant_id: team-a
      # username: copilot        # password: set COPILOT_INTEGRATIONS__LOGS__LOKI__PASSWORD
    file:
      directory: ./data/logs

executor:
  backend: docker
  kubernetes_namespaces: [default]
