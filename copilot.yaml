# Incident Copilot configuration. Secrets never go in this file:
# API keys, tokens and database URLs come from environment variables (see .env.example).
# Any value here can be overridden with COPILOT_<SECTION>__<KEY>, e.g. COPILOT_LLM__MODEL.

environment: dev

# Every service the copilot may investigate and act on. repo/paths let the code agent find
# the commits that touched a service; branch defaults to the repository's default branch.
services:
  - name: gateway
    team: platform
    repo: khalerishabh/agentic-incident-copilot
    paths: [demo/services/gateway.py, demo/common]
  - name: orders
    team: commerce
    repo: khalerishabh/agentic-incident-copilot
    paths: [demo/services/orders.py, demo/common]
  - name: payments
    team: payments
    repo: khalerishabh/agentic-incident-copilot
    paths: [demo/services/payments.py, demo/common]
  - name: inventory
    team: commerce
    repo: khalerishabh/agentic-incident-copilot
    paths: [demo/services/inventory.py, demo/common]

llm:
  provider: anthropic
  model: claude-sonnet-4-5
  temperature: 0.0

mcp:
  logs_url: http://localhost:9101/mcp
  metrics_url: http://localhost:9102/mcp
  github_url: http://localhost:9103/mcp
  runbook_url: http://localhost:9104/mcp

budget:
  tokens_per_incident: 60000

guardrails:
  dry_run: true
  allowed_actions: [restart, scale, rollback, disable_flag]
  max_replicas: 5

integrations:
  logs:
    # loki for the demo stack and real installs; file reads ./data/logs for quick local runs.
    backend: loki
    service_label: service
    fields:
      timestamp: ts
      level: level
      message: msg
      request_id: request_id
    max_lines: 50
    max_scan_lines: 2000
    loki:
      url: http://localhost:3100
      line_format: json
      timeout_seconds: 10
      max_attempts: 3
      # tenant_id: team-a
      # username: copilot        # password: set COPILOT_INTEGRATIONS__LOGS__LOKI__PASSWORD
    file:
      directory: ./data/logs

  metrics:
    # Works with Prometheus and anything that speaks its API (Mimir, Thanos, VictoriaMetrics).
    service_label: service
    # resource_service_label: container   # if memory/CPU series use a different label
    names:
      requests_total: http_requests_total
      duration_bucket: http_request_duration_seconds_bucket
      status_label: status
      error_status_regex: "5.."
      upstream_errors_total: upstream_errors_total
      upstream_label: upstream
      memory_bytes: process_resident_memory_bytes
      cpu_seconds_total: process_cpu_seconds_total
    allow_raw_promql: true
    max_series: 50
    prometheus:
      url: http://localhost:9090
      query_timeout: 10s
      timeout_seconds: 15
      max_attempts: 3
      # username: copilot   # password: COPILOT_INTEGRATIONS__METRICS__PROMETHEUS__PASSWORD
      # bearer token: COPILOT_INTEGRATIONS__METRICS__PROMETHEUS__BEARER_TOKEN

  code:
    github:
      api_url: https://api.github.com   # GitHub Enterprise: https://<host>/api/v3
      # token: set GITHUB_TOKEN or COPILOT_INTEGRATIONS__CODE__GITHUB__TOKEN
      max_commits: 30
      max_files: 20
      max_patch_chars: 4000
      max_total_patch_chars: 20000

  runbooks:
    # pgvector: hybrid search (meaning + exact words) in the copilot's Postgres.
    # keyword: in-memory text search, no database or embedding model needed.
    backend: pgvector
    directory: ./runbooks
    max_chunk_chars: 1500
    max_results: 5
    embeddings:
      # Local and private by default: run `ollama pull nomic-embed-text` once.
      provider: ollama
      model: nomic-embed-text
      dimensions: 768
      query_prefix: "search_query: "
      document_prefix: "search_document: "
      # base_url: http://localhost:11434
      # OpenAI or any compatible API instead:
      #   provider: openai, model: text-embedding-3-small, dimensions: 1536,
      #   query_prefix: "", document_prefix: ""   (key from OPENAI_API_KEY)

executor:
  backend: docker
  kubernetes_namespaces: [default]
