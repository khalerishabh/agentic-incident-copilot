x-demo-app: &demo
  build:
    context: .
    dockerfile: demo/Dockerfile
  environment: &demo-env
    LOG_DIR: /var/log/demo
    CHAOS_ADMIN_TOKEN: ${CHAOS_ADMIN_TOKEN:-change-me}
    ORDERS_URL: http://orders:8000
    PAYMENTS_URL: http://payments:8000
    INVENTORY_URL: http://inventory:8000
    DATABASE_URL: postgresql://copilot:copilot@postgres:5432/demo
  volumes:
    - ./data/logs:/var/log/demo
  labels:
    incident.copilot.logs: "true"
  depends_on:
    - postgres

# The copilot image runs every MCP server. Inside the stack they reach Loki, Prometheus and
# Postgres by service name, so those URLs are overridden here; copilot.yaml keeps the
# localhost URLs for running servers directly on your machine.
x-copilot: &copilot
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./copilot.yaml:/app/copilot.yaml:ro
    - ./runbooks:/app/runbooks:ro
  environment: &copilot-env
    COPILOT_POSTGRES_URL: postgresql://copilot:copilot@postgres:5432/copilot
    COPILOT_INTEGRATIONS__LOGS__BACKEND: loki
    COPILOT_INTEGRATIONS__LOGS__LOKI__URL: http://loki:3100
    COPILOT_INTEGRATIONS__METRICS__PROMETHEUS__URL: http://prometheus:9090
    COPILOT_INTEGRATIONS__RUNBOOKS__BACKEND: ${RUNBOOKS_BACKEND:-pgvector}
    COPILOT_INTEGRATIONS__RUNBOOKS__INDEX_ON_START: "true"
    COPILOT_INTEGRATIONS__RUNBOOKS__EMBEDDINGS__BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-ready: &ready
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: gateway }
    ports: ["8000:8000"]

  orders:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: orders }
    ports: ["8001:8000"]

  payments:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: payments }
    ports: ["8002:8000"]

  inventory:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: inventory }
    ports: ["8003:8000"]

  prometheus:
    image: prom/prometheus:v3.13.5
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]

  loadgen:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: loadgen, GATEWAY_URL: "http://gateway:8000" }
    command: ["python", "-m", "demo.loadgen"]
    labels:
      incident.copilot.logs: "false"
    ports: []

  loki:
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["12345:12345"]
    depends_on:
      - loki

  mcp-logs:
    <<: *copilot
    command: ["python", "-m", "mcp_servers.logs.server"]
    ports: ["9101:9101"]
    environment: { <<: *copilot-env, PORT: "9101" }
    depends_on: [loki]
    healthcheck:
      <<: *ready
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/readyz', timeout=3)"]

  mcp-metrics:
    <<: *copilot
    command: ["python", "-m", "mcp_servers.metrics.server"]
    ports: ["9102:9102"]
    environment: { <<: *copilot-env, PORT: "9102" }
    depends_on: [prometheus]
    healthcheck:
      <<: *ready
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/readyz', timeout=3)"]

  mcp-github:
    <<: *copilot
    command: ["python", "-m", "mcp_servers.github.server"]
    ports: ["9103:9103"]
    environment: { <<: *copilot-env, PORT: "9103" }
    healthcheck:
      <<: *ready
      # Liveness only: GitHub being briefly unreachable should not mark the stack unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/healthz', timeout=3)"]

  mcp-runbook:
    <<: *copilot
    command: ["python", "-m", "mcp_servers.runbook.server"]
    ports: ["9104:9104"]
    environment: { <<: *copilot-env, PORT: "9104" }
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *ready
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9104/readyz', timeout=3)"]

volumes:
  pgdata:
  lokidata:
