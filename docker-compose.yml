x-demo-app: &demo
  build:
    context: .
    dockerfile: demo/Dockerfile
  environment: &demo-env
    LOG_DIR: /var/log/demo
    CHAOS_ADMIN_TOKEN: ${CHAOS_ADMIN_TOKEN:-change-me}
    ORDERS_URL: http://orders:8000
    PAYMENTS_URL: http://payments:8000
    INVENTORY_URL: http://inventory:8000
    DATABASE_URL: postgresql://copilot:copilot@postgres:5432/demo
  volumes:
    - ./data/logs:/var/log/demo
  labels:
    incident.copilot.logs: "true"
  depends_on:
    - postgres

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  gateway:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: gateway }
    ports: ["8000:8000"]

  orders:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: orders }
    ports: ["8001:8000"]

  payments:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: payments }
    ports: ["8002:8000"]

  inventory:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: inventory }
    ports: ["8003:8000"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]

  loadgen:
    <<: *demo
    environment: { <<: *demo-env, SERVICE_NAME: loadgen, GATEWAY_URL: "http://gateway:8000" }
    command: ["python", "-m", "demo.loadgen"]
    labels:
      incident.copilot.logs: "false"
    ports: []

  loki:
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["12345:12345"]
    depends_on:
      - loki

volumes:
  pgdata:
  lokidata:
